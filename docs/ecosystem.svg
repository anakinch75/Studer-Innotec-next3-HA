<svg viewBox="0 0 820 605" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <title>Studer Next3 — Home Energy Optimization with Home Assistant</title>
  <defs>
    <marker id="aGold" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#c8900a"/></marker>
    <marker id="aBlue" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#5c7cfa"/></marker>
    <marker id="aGreen" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#40a06a"/></marker>
    <marker id="aPurple" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#9c27b0"/></marker>
    <marker id="aCyan" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#0277bd"/></marker>
    <marker id="aOrange" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3z" fill="#e65100"/></marker>
  </defs>

  <rect width="820" height="605" fill="#f7f8fc" rx="12"/>
  <text x="410" y="30" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a2e">Studer Next3 × Home Assistant — Home Energy Optimization</text>

  <!-- SOURCES -->
  <rect x="20" y="50" width="175" height="78" rx="8" fill="#fffbea" stroke="#c8900a" stroke-width="1.8"/>
  <text x="107" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#9a6e00">☀️  Solar PV</text>
  <text x="107" y="87" text-anchor="middle" font-size="9.5" fill="#555">pv_power · pv_energy</text>
  <text x="107" y="101" text-anchor="middle" font-size="9.5" fill="#555">pv1_voltage · pv1_current</text>
  <text x="107" y="117" text-anchor="middle" font-size="9" fill="#9a6e00" font-style="italic">Slave 1 &amp; 14</text>

  <rect x="322" y="50" width="176" height="78" rx="8" fill="#eef1ff" stroke="#5c7cfa" stroke-width="1.8"/>
  <text x="410" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#2a4acc">⚡  Grid</text>
  <text x="410" y="87" text-anchor="middle" font-size="9.5" fill="#555">ac_source_active_power</text>
  <text x="410" y="101" text-anchor="middle" font-size="9.5" fill="#555">grid_voltage · frequency</text>
  <text x="410" y="117" text-anchor="middle" font-size="9" fill="#2a4acc" font-style="italic">Slave 7</text>

  <rect x="625" y="50" width="175" height="78" rx="8" fill="#edfaf3" stroke="#40a06a" stroke-width="1.8"/>
  <text x="712" y="71" text-anchor="middle" font-size="11" font-weight="700" fill="#1e6e44">🔋  Battery</text>
  <text x="712" y="87" text-anchor="middle" font-size="9.5" fill="#555">battery_soc · battery_power</text>
  <text x="712" y="101" text-anchor="middle" font-size="9.5" fill="#555">voltage · current · temp · SoH</text>
  <text x="712" y="117" text-anchor="middle" font-size="9" fill="#1e6e44" font-style="italic">Slave 1 &amp; 2</text>

  <!-- Sources → Next3 -->
  <path d="M 107,128 L 107,162 L 262,162 L 262,182" fill="none" stroke="#c8900a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#aGold)"/>
  <path d="M 410,128 L 410,182" fill="none" stroke="#5c7cfa" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#aBlue)"/>
  <path d="M 712,128 L 712,162 L 558,162 L 558,182" fill="none" stroke="#40a06a" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#aGreen)"/>

  <!-- STUDER NEXT3 -->
  <rect x="210" y="182" width="400" height="52" rx="10" fill="#1a1a2e" stroke="#444" stroke-width="1.5"/>
  <text x="410" y="204" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">⚙️  Studer Next3 — Hybrid Inverter</text>
  <text x="410" y="222" text-anchor="middle" font-size="9.5" fill="#aaa">inverter_status · ac_loads_active_power · ac_loads_consumed_energy</text>

  <!-- Next3 → HA -->
  <path d="M 410,234 L 410,272" fill="none" stroke="#9c27b0" stroke-width="2.2" marker-end="url(#aPurple)"/>
  <text x="426" y="257" font-size="9" fill="#7b1fa2">Modbus TCP</text>

  <!-- HOME ASSISTANT -->
  <rect x="140" y="272" width="320" height="52" rx="10" fill="#0288d1" stroke="#0277bd" stroke-width="1.5"/>
  <text x="300" y="294" text-anchor="middle" font-size="13" font-weight="700" fill="#fff">🏠  Home Assistant</text>
  <text x="300" y="312" text-anchor="middle" font-size="9.5" fill="#e1f5fe">studer_next3 integration · 22 entities · 5 devices</text>

  <!-- HA → Energy Dashboard -->
  <path d="M 460,298 L 488,298" fill="none" stroke="#e65100" stroke-width="1.8" marker-end="url(#aOrange)"/>

  <!-- Energy Dashboard -->
  <rect x="488" y="272" width="192" height="52" rx="10" fill="#ff8f00" stroke="#e65100" stroke-width="1.5"/>
  <text x="584" y="294" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">📊  Energy Dashboard</text>
  <text x="584" y="308" text-anchor="middle" font-size="9" fill="#fff3e0">Solar · Grid import/export</text>
  <text x="584" y="321" text-anchor="middle" font-size="9" fill="#fff3e0">Battery · Home consumption</text>

  <!-- HA → Consumers -->
  <path d="M 152,324 L 152,351 L 88,351 L 88,374" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aCyan)"/>
  <path d="M 243,324 L 243,374" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aCyan)"/>
  <path d="M 388,324 L 388,374" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aCyan)"/>
  <path d="M 435,324 L 435,351 L 553,351 L 553,374" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aCyan)"/>
  <path d="M 455,324 L 455,351 L 719,351 L 719,374" fill="none" stroke="#0277bd" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#aCyan)"/>

  <!-- EV Charging -->
  <rect x="18" y="374" width="140" height="105" rx="8" fill="#fff3e0" stroke="#fb8c00" stroke-width="1.8"/>
  <text x="88" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#bf360c">🚗  EV Charging</text>
  <text x="88" y="410" text-anchor="middle" font-size="9" fill="#555">Charge on PV surplus:</text>
  <text x="88" y="423" text-anchor="middle" font-size="9" fill="#555">ac_source_active_power</text>
  <text x="88" y="436" text-anchor="middle" font-size="9" fill="#555">&lt; 0 (exporting to grid)</text>
  <line x1="28" y1="447" x2="148" y2="447" stroke="#eee" stroke-width="1"/>
  <text x="88" y="461" text-anchor="middle" font-size="8.5" fill="#fb8c00" font-style="italic">EVSE / Wallbox</text>
  <text x="88" y="474" text-anchor="middle" font-size="8.5" fill="#fb8c00" font-style="italic">HA integration</text>

  <!-- Heat Pump / AC -->
  <rect x="173" y="374" width="140" height="105" rx="8" fill="#fce4ec" stroke="#e91e8c" stroke-width="1.8"/>
  <text x="243" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#880e4f">🌡️  Heat Pump / AC</text>
  <text x="243" y="410" text-anchor="middle" font-size="9" fill="#555">Run when battery_soc</text>
  <text x="243" y="423" text-anchor="middle" font-size="9" fill="#555">&gt; threshold or pv_power</text>
  <text x="243" y="436" text-anchor="middle" font-size="9" fill="#555">&gt; ac_loads_active_power</text>
  <line x1="183" y1="447" x2="303" y2="447" stroke="#eee" stroke-width="1"/>
  <text x="243" y="461" text-anchor="middle" font-size="8.5" fill="#e91e8c" font-style="italic">climate entity</text>
  <text x="243" y="474" text-anchor="middle" font-size="8.5" fill="#e91e8c" font-style="italic">HVAC integration</text>

  <!-- Water / Pool -->
  <rect x="328" y="374" width="140" height="105" rx="8" fill="#e8f5e9" stroke="#43a047" stroke-width="1.8"/>
  <text x="398" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#1b5e20">💧  Water / Pool</text>
  <text x="398" y="410" text-anchor="middle" font-size="9" fill="#555">Activate when</text>
  <text x="398" y="423" text-anchor="middle" font-size="9" fill="#555">pv_power &gt; threshold</text>
  <text x="398" y="436" text-anchor="middle" font-size="9" fill="#555">&amp; battery_soc &gt; min</text>
  <line x1="338" y1="447" x2="458" y2="447" stroke="#eee" stroke-width="1"/>
  <text x="398" y="461" text-anchor="middle" font-size="8.5" fill="#43a047" font-style="italic">switch / water_heater</text>
  <text x="398" y="474" text-anchor="middle" font-size="8.5" fill="#43a047" font-style="italic">entity</text>

  <!-- Cave / Cellar -->
  <rect x="483" y="374" width="140" height="105" rx="8" fill="#ede7f6" stroke="#7e57c2" stroke-width="1.8"/>
  <text x="553" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#4527a0">🍷  Cave / Cellar</text>
  <text x="553" y="410" text-anchor="middle" font-size="9" fill="#555">Run climate control</text>
  <text x="553" y="423" text-anchor="middle" font-size="9" fill="#555">only when pv_power</text>
  <text x="553" y="436" text-anchor="middle" font-size="9" fill="#555">&gt; threshold</text>
  <line x1="493" y1="447" x2="613" y2="447" stroke="#eee" stroke-width="1"/>
  <text x="553" y="461" text-anchor="middle" font-size="8.5" fill="#7e57c2" font-style="italic">climate / switch</text>
  <text x="553" y="474" text-anchor="middle" font-size="8.5" fill="#7e57c2" font-style="italic">entity</text>

  <!-- Smart Appliances -->
  <rect x="638" y="374" width="162" height="105" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="1.8"/>
  <text x="719" y="394" text-anchor="middle" font-size="11" font-weight="700" fill="#0d47a1">🏡  Appliances</text>
  <text x="719" y="410" text-anchor="middle" font-size="9" fill="#555">Schedule when</text>
  <text x="719" y="423" text-anchor="middle" font-size="9" fill="#555">pv_power &gt; threshold</text>
  <text x="719" y="436" text-anchor="middle" font-size="9" fill="#555">&amp; battery_soc &gt; min</text>
  <line x1="648" y1="447" x2="790" y2="447" stroke="#eee" stroke-width="1"/>
  <text x="719" y="461" text-anchor="middle" font-size="8.5" fill="#1976d2" font-style="italic">switch / input_boolean</text>
  <text x="719" y="474" text-anchor="middle" font-size="8.5" fill="#1976d2" font-style="italic">HA automations</text>

  <!-- LEGEND -->
  <rect x="18" y="495" width="784" height="95" rx="8" fill="#eef0f5" opacity="0.8"/>
  <text x="410" y="513" text-anchor="middle" font-size="10" font-weight="600" fill="#333">Key sensors for automations</text>
  <text x="38" y="529" font-size="9" fill="#555">● Grid export: ac_source_active_power &lt; 0 → surplus available (positive = import)</text>
  <text x="38" y="543" font-size="9" fill="#555">● Battery: battery_soc (%), battery_power W (positive = charging)</text>
  <text x="38" y="557" font-size="9" fill="#555">● PV surplus: pv_power − ac_loads_active_power &gt; threshold</text>
  <text x="430" y="529" font-size="9" fill="#555">● Energy Dashboard: pv_energy · ac_source consumed/produced</text>
  <text x="430" y="543" font-size="9" fill="#555">  battery charging/discharging · ac_loads_consumed_energy</text>
  <text x="430" y="557" font-size="9" fill="#555">● Modbus TCP — no cloud, fully local · polling 5–300 s</text>
  <text x="430" y="571" font-size="9" fill="#555">● 22 entities · 5 devices (Grid &amp; Loads · Solar PV · Battery · Inverter · hub)</text>
</svg>
